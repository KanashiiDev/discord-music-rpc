name: Electron Build & Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Select the Platform to Compile"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - linux-only
          - windows-only
          - macos-only

permissions:
  contents: write

jobs:
  build-win:
    name: Build Windows
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows-only'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run build:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist
          retention-days: 5

  build-linux:
    name: Build Linux
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        run: npm run build:linux

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/**
          retention-days: 5

  build-mac:
    name: Build macOS
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos-only'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install dmg-license
        run: npm install --no-save dmg-license

      - name: Build macOS App
        run: npm run build:mac:universal

      - name: Upload Mac Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: [build-win, build-linux, build-mac]
    if: always() && (needs.build-win.result == 'success' || needs.build-win.result == 'skipped') && (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') && (needs.build-mac.result == 'success' || needs.build-mac.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      x64_sha256: ${{ steps.hashes.outputs.x64_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download Windows Artifacts
        if: needs.build-win.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./dist

      - name: Download Linux Artifacts
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: ./dist

      - name: Download Mac Artifacts
        if: needs.build-mac.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: ./dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare Release
        run: npm run prepare-release

      - name: Rename pacman artifact
        run: |
          cd release
          for f in *.pacman; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.pacman}.pkg.tar.zst"
          done

      - name: Compute hashes
        id: hashes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          X64="release/discord-music-rpc-${VERSION}-x86_64.AppImage"
          if [ -f "$X64" ]; then
            SRI_HASH="sha256-$(openssl dgst -binary -sha256 "$X64" | base64)"
            echo "x64_sha256=$SRI_HASH" >> "$GITHUB_OUTPUT"
          else
            echo "x64_sha256=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          files: |
            release/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-nix:
    name: Update Nix Hashes
    needs: create-release
    runs-on: ubuntu-latest
    if: always() && needs.create-release.result == 'success' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Patch nix/package.nix
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          X64_SHA256: ${{ needs.create-release.outputs.x64_sha256 || '' }}
        run: |
          python3 scripts/updateNixHashes.py \
            --file nix/package.nix \
            --version "$VERSION" \
            ${X64_SHA256:+--x64 "$X64_SHA256"}

      - name: Commit
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet nix/package.nix && echo "nothing to commit" && exit 0
          git add nix/package.nix
          git commit -m "chore(nix): update hashes for ${VERSION} [skip ci]"
          git push origin main
